<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать трату</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {{template "header"}}
 
    <main>
        <h1>Редактировать трату</h1>
 
        <form method="POST" action="/expenses/{{.Expense.ID}}/edit">
            <p>Сумма: <input type="text" name="amount" value="{{.Expense.Amount}}" required></p>
            <p>Описание: <input type="text" name="description" value="{{.Expense.Description}}" required></p>
            <p>Категория:
                <select name="category_id" required>
                    <option value="">Выберите категорию</option>
                    {{range .Categories}}
                    <option value="{{.ID}}" {{if eq .ID $.Expense.CategoryID}}selected{{end}}>{{.Name}}</option>
                    {{end}}
                </select>
            </p>
            <p>Дата: <input type="date" name="date" value="{{.Expense.Date}}" required></p>
            <button type="submit">Сохранить</button>
            <a href="/expenses">Отмена</a>
        </form>
    </main>
 
    {{template "footer"}}
</body>
</html>
